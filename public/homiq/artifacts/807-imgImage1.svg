<svg xmlns="http://www.w3.org/2000/svg" width="489.0" height="401.227" viewBox="0 0 489.0 401.227" role="img"><title>Type, spacing &amp; accessibility</title><desc>Estimated typography; WCAG 2.2, December 2024</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="489.0" height="401.227" rx="10" fill="white" stroke="none"/><text x="24" y="32" fill="#505a63" font-size="20" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Type, spacing &amp; accessibility</tspan></text><text x="24" y="58" fill="#7a7a7a" font-size="12" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Estimated typography; WCAG 2.2, December 2024</tspan></text><text x="24" y="100" fill="#141817" font-size="27" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Aa  ·  Clear hierarchy</tspan></text><text x="24" y="140" fill="#505a63" font-size="14" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Display / title ≈ 28–34 px; labels ≈ 13–16 px.</tspan></text><text x="24" y="191" fill="#28663f" font-size="17" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Estimated spacing rhythm</tspan></text><rect x="24" y="215" width="8" height="35" rx="2" fill="#b5c9b2" stroke="none"/><text x="24" y="274" fill="#505a63" font-size="13" font-weight="400" text-anchor="start"><tspan x="24" dy="0">8</tspan></text><rect x="109" y="215" width="12" height="35" rx="2" fill="#b5c9b2" stroke="none"/><text x="109" y="274" fill="#505a63" font-size="13" font-weight="400" text-anchor="start"><tspan x="109" dy="0">12</tspan></text><rect x="194" y="215" width="16" height="35" rx="2" fill="#b5c9b2" stroke="none"/><text x="194" y="274" fill="#505a63" font-size="13" font-weight="400" text-anchor="start"><tspan x="194" dy="0">16</tspan></text><rect x="279" y="215" width="24" height="35" rx="2" fill="#b5c9b2" stroke="none"/><text x="279" y="274" fill="#505a63" font-size="13" font-weight="400" text-anchor="start"><tspan x="279" dy="0">24</tspan></text><rect x="364" y="215" width="32" height="35" rx="2" fill="#b5c9b2" stroke="none"/><text x="364" y="274" fill="#505a63" font-size="13" font-weight="400" text-anchor="start"><tspan x="364" dy="0">32</tspan></text><text x="24" y="315" fill="#505a63" font-size="14" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Sample contrast: #F7F5EE / #141817 = 16.4:1 (sRGB). Verify</tspan><tspan x="24" dy="19.599999999999998">overlays, disabled labels, target sizes, focus order and non-</tspan><tspan x="24" dy="19.599999999999998">drag inputs. </tspan></text></g></svg>