<svg xmlns="http://www.w3.org/2000/svg" width="629.0" height="112.195" viewBox="0 0 629.0 112.195" role="img"><title>Room → Device → State → Action</title><desc>A shared context model for control</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="629.0" height="112.195" rx="10" fill="white" stroke="none"/><text x="24" y="32" fill="#505a63" font-size="20" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Room → Device → State → Action</tspan></text><text x="24" y="58" fill="#7a7a7a" font-size="12" font-weight="400" text-anchor="start"><tspan x="24" dy="0">A shared context model for control</tspan></text><text x="24" y="97.195" fill="#505a63" font-size="15" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Context makes the next action easier to interpret.</tspan></text></g></svg>