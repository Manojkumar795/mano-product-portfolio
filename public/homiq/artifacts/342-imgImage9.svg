<svg xmlns="http://www.w3.org/2000/svg" width="950.0" height="555.891" viewBox="0 0 950.0 555.891" role="img"><title>How the audit becomes a product decision</title><desc>Screen counts and control criteria</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="950.0" height="555.891" rx="10" fill="white" stroke="none"/><text x="24" y="32" fill="#505a63" font-size="20" font-weight="500" text-anchor="start"><tspan x="24" dy="0">How the audit becomes a product decision</tspan></text><text x="24" y="58" fill="#7a7a7a" font-size="12" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Screen counts and control criteria</tspan></text><rect x="24.0" y="90.0" width="443.0" height="208.94549999999998" rx="8" fill="#f3f6f3" stroke="#dce5dd"/><text x="40.0" y="116.0" fill="#266641" font-size="17" font-weight="500" text-anchor="start"><tspan x="40.0" dy="0">Counting rules</tspan></text><text x="40.0" y="145.0" fill="#505a63" font-size="14" font-weight="400" text-anchor="start"><tspan x="40.0" dy="0">One control per visible option, switch, button or</tspan><tspan x="40.0" dy="19.599999999999998">continuous input. Row + checkbox counts once. Fields and</tspan><tspan x="40.0" dy="19.599999999999998">OS chrome are separate. 176 controls and 15 editable</tspan><tspan x="40.0" dy="19.599999999999998">fields across 29 frames.</tspan></text><rect x="483.0" y="90.0" width="443.0" height="208.94549999999998" rx="8" fill="#f3f6f3" stroke="#dce5dd"/><text x="499.0" y="116.0" fill="#266641" font-size="17" font-weight="500" text-anchor="start"><tspan x="499.0" dy="0">Decision stages</tspan></text><text x="499.0" y="145.0" fill="#505a63" font-size="14" font-weight="400" text-anchor="start"><tspan x="499.0" dy="0">Decision stages: device 4, room 3, scene 4, recovery 3.</tspan><tspan x="499.0" dy="19.599999999999998">Count one non-result stage that asks for a method,</tspan><tspan x="499.0" dy="19.599999999999998">confirmation, selection or data entry; options do not add</tspan><tspan x="499.0" dy="19.599999999999998">stages.</tspan></text><rect x="24.0" y="314.9455" width="443.0" height="208.94549999999998" rx="8" fill="#f3f6f3" stroke="#dce5dd"/><text x="40.0" y="340.9455" fill="#266641" font-size="17" font-weight="500" text-anchor="start"><tspan x="40.0" dy="0">Control rubric (0–8)</tspan></text><text x="40.0" y="369.9455" fill="#505a63" font-size="14" font-weight="400" text-anchor="start"><tspan x="40.0" dy="0">Four criteria, 0 absent / 1 partial / 2 explicit: room +</tspan><tspan x="40.0" dy="19.599999999999998">appliance identity; power text + switch; numeric value +</tspan><tspan x="40.0" dy="19.599999999999998">unit + bounds; non-drag value alternative. AC 6, lamp 5,</tspan><tspan x="40.0" dy="19.599999999999998">TV 5. Visible evidence, not usability.</tspan></text><rect x="483.0" y="314.9455" width="443.0" height="208.94549999999998" rx="8" fill="#f3f6f3" stroke="#dce5dd"/><text x="499.0" y="340.9455" fill="#266641" font-size="17" font-weight="500" text-anchor="start"><tspan x="499.0" dy="0">What to test next</tspan></text><text x="499.0" y="369.9455" fill="#505a63" font-size="14" font-weight="400" text-anchor="start"><tspan x="499.0" dy="0">First: setup recovery, because 3 results have no error</tspan><tspan x="499.0" dy="19.599999999999998">counterpart. Next: precise appliance inputs and scene-</tspan><tspan x="499.0" dy="19.599999999999998">state comprehension. Validate independently; frequency</tspan><tspan x="499.0" dy="19.599999999999998">and outcome data require observation.</tspan></text></g></svg>