<svg xmlns="http://www.w3.org/2000/svg" width="328.0" height="317.828" viewBox="0 0 328.0 317.828" role="img"><title>Prioritize confidence before complexity</title><desc>Decision framework · validate with tasks</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="328.0" height="317.828" rx="10" fill="white" stroke="none"/><text x="24" y="32" fill="#505a63" font-size="13.666666666666666" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Prioritize confidence before complexity</tspan></text><text x="24" y="58" fill="#7a7a7a" font-size="9.11111111111111" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Decision framework · validate with tasks</tspan></text><text x="24" y="91" fill="#28663f" font-size="16" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Guided setup</tspan></text><text x="24" y="118" fill="#505a63" font-size="13" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Uncertainty → staged steps + named result.</tspan><tspan x="24" dy="18.2">Expect confidence; test interrupted</tspan><tspan x="24" dy="18.2">pairing.</tspan></text><text x="24" y="195" fill="#28663f" font-size="16" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Explicit scene states</tspan></text><text x="24" y="222" fill="#505a63" font-size="13" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Ambiguous intent → membership then ON/OFF.</tspan><tspan x="24" dy="18.2">Expect fewer state errors; test Goodnight.</tspan></text></g></svg>