<svg xmlns="http://www.w3.org/2000/svg" width="374.0" height="379.922" viewBox="0 0 374.0 379.922" role="img"><title>Access model decision matrix</title><desc>Criteria: recognition, access depth, density, recovery</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="374.0" height="379.922" rx="10" fill="white" stroke="none"/><text x="24" y="32" fill="#505a63" font-size="15.583333333333334" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Access model decision matrix</tspan></text><text x="24" y="58" fill="#7a7a7a" font-size="10.38888888888889" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Criteria: recognition, access depth, density, recovery</tspan></text><text x="24" y="90" fill="#28663f" font-size="15" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Room-first</tspan></text><text x="24" y="114" fill="#505a63" font-size="13" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Familiar location; photo cards use space.</tspan></text><text x="24" y="157" fill="#28663f" font-size="15" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Category-first</tspan></text><text x="24" y="181" fill="#505a63" font-size="13" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Quick type access; weaker room context.</tspan></text><text x="24" y="224" fill="#28663f" font-size="15" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Chosen combination</tspan></text><text x="24" y="248" fill="#505a63" font-size="13" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Home categories + dedicated Rooms tab.</tspan></text><text x="24" y="291" fill="#28663f" font-size="15" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Validation</tspan></text><text x="24" y="315" fill="#505a63" font-size="13" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Compare finding a similarly named light.</tspan></text></g></svg>