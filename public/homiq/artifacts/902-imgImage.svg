<svg xmlns="http://www.w3.org/2000/svg" width="490.0" height="392.0" viewBox="0 0 490.0 392.0" role="img"><title>A household, several mental models</title><desc>Published research + HOMIQ audit implications</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="490.0" height="392.0" rx="10" fill="white" stroke="none"/><text x="24" y="32" fill="#505a63" font-size="20" font-weight="500" text-anchor="start"><tspan x="24" dy="0">A household, several mental models</tspan></text><text x="24" y="58" fill="#7a7a7a" font-size="12" font-weight="400" text-anchor="start"><tspan x="24" dy="0">Published research + HOMIQ audit implications</tspan></text><text x="24" y="104" fill="#28663f" font-size="11" font-weight="500" text-anchor="start"><tspan x="24" dy="0">01</tspan></text><text x="58" y="104" fill="#141817" font-size="16" font-weight="500" text-anchor="start"><tspan x="58" dy="0">Manageability</tspan></text><text x="58" y="126" fill="#505a63" font-size="12" font-weight="400" text-anchor="start"><tspan x="58" dy="0">Brush et al., CHI 2011: managing a home system is an adoption</tspan><tspan x="58" dy="16">barrier.</tspan></text><path d="M58 150L462.0 150" fill="none" stroke="#e1e7e1" stroke-width="1.5"/><text x="24" y="176" fill="#28663f" font-size="11" font-weight="500" text-anchor="start"><tspan x="24" dy="0">02</tspan></text><text x="58" y="176" fill="#141817" font-size="16" font-weight="500" text-anchor="start"><tspan x="58" dy="0">Shared understanding</tspan></text><text x="58" y="198" fill="#505a63" font-size="12" font-weight="400" text-anchor="start"><tspan x="58" dy="0">Zeng &amp; Roesner, USENIX 2019: make controls intelligible to</tspan><tspan x="58" dy="16">multiple inhabitants.</tspan></text><path d="M58 222L462.0 222" fill="none" stroke="#e1e7e1" stroke-width="1.5"/><text x="24" y="248" fill="#28663f" font-size="11" font-weight="500" text-anchor="start"><tspan x="24" dy="0">03</tspan></text><text x="58" y="248" fill="#141817" font-size="16" font-weight="500" text-anchor="start"><tspan x="58" dy="0">Predictability</tspan></text><text x="58" y="270" fill="#505a63" font-size="12" font-weight="400" text-anchor="start"><tspan x="58" dy="0">UChicago CS, Feb 2019: interacting rules can produce unexpected</tspan><tspan x="58" dy="16">behavior.</tspan></text><path d="M58 294L462.0 294" fill="none" stroke="#e1e7e1" stroke-width="1.5"/><text x="24" y="320" fill="#28663f" font-size="11" font-weight="500" text-anchor="start"><tspan x="24" dy="0">04</tspan></text><text x="58" y="320" fill="#141817" font-size="16" font-weight="500" text-anchor="start"><tspan x="58" dy="0">Setup uncertainty</tspan></text><text x="58" y="342" fill="#505a63" font-size="12" font-weight="400" text-anchor="start"><tspan x="58" dy="0">Permissions, discovery and pairing may fail; no failure UI</tspan><tspan x="58" dy="16">supplied.</tspan></text></g></svg>