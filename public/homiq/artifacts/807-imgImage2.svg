<svg xmlns="http://www.w3.org/2000/svg" width="485.0" height="561.094" viewBox="0 0 485.0 561.094" role="img"><title>Foundations &amp; hierarchy</title><desc>Observed patterns · implementation checks below</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="485.0" height="561.094" rx="10" fill="white" stroke="none"/><text x="24" y="32" fill="#505a63" font-size="20" font-weight="500" text-anchor="start"><tspan x="24" dy="0">Foundations &amp; hierarchy</tspan></text><rect x="24.0" y="86.0" width="437.0" height="140.3646666666667" rx="8" fill="#f3f6f3" stroke="#dce5dd"/><text x="40.0" y="112.0" fill="#266641" font-size="17" font-weight="500" text-anchor="start"><tspan x="40.0" dy="0">Layered surfaces</tspan></text><text x="40.0" y="141.0" fill="#505a63" font-size="14" font-weight="400" text-anchor="start"><tspan x="40.0" dy="0">Near-black base, green-gray cards and sand primary</tspan><tspan x="40.0" dy="19.599999999999998">actions. Text and ON/OFF labels supplement color.</tspan></text><rect x="24.0" y="242.3646666666667" width="437.0" height="140.3646666666667" rx="8" fill="#f3f6f3" stroke="#dce5dd"/><text x="40.0" y="268.3646666666667" fill="#266641" font-size="17" font-weight="500" text-anchor="start"><tspan x="40.0" dy="0">Hierarchy and navigation</tspan></text><text x="40.0" y="297.3646666666667" fill="#505a63" font-size="14" font-weight="400" text-anchor="start"><tspan x="40.0" dy="0">Room photos, device counts and visible values. Home /</tspan><tspan x="40.0" dy="19.599999999999998">Rooms / Profile stays consistent across daily controls.</tspan></text><rect x="24.0" y="398.7293333333334" width="437.0" height="140.3646666666667" rx="8" fill="#f3f6f3" stroke="#dce5dd"/><text x="40.0" y="424.7293333333334" fill="#266641" font-size="17" font-weight="500" text-anchor="start"><tspan x="40.0" dy="0">Progress and recovery</tspan></text><text x="40.0" y="453.7293333333334" fill="#505a63" font-size="14" font-weight="400" text-anchor="start"><tspan x="40.0" dy="0">Setup uses staged progress and named results.</tspan><tspan x="40.0" dy="19.599999999999998">Extend it with offline, failure and retry states.</tspan><tspan x="40.0" dy="19.599999999999998"></tspan></text></g></svg>